name: Deploy ATMOS//SIM to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Simulation smoke test
        run: npm test --silent -- pulse 32 36 1

      - name: Build single-file site
        run: npm run build:standalone

      - uses: actions/configure-pages@v5

      - name: Stage site
        run: |
          mkdir -p site
          cp atmos-sim-standalone.html site/index.html
          cp atmos-sim-standalone.html site/atmos-sim-standalone.html
          cp README.md site/README.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
